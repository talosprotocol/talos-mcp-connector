[project]
name = "talos-mcp-connector"
version = "0.1.22"
description = "MCP Connector for Talos Protocol"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "requests",
    "uvicorn",
    "fastapi",
    "talos-sdk-py @ git+https://github.com/talosprotocol/talos-sdk-py.git"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
